AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Store JSON blobs in S3, routed to a per-property folder by access code.

Parameters:
  BucketName:
    Type: String
    Default: iiif-json-blob
    Description: Name of the S3 bucket to create (must be globally unique).
  AllowedUploadOrigins:
    Type: CommaDelimitedList
    Default: "*"
    Description: Browser origins allowed to POST to the upload function URL (comma-separated, or *).
  PublicDomainName:
    Type: String
    Default: jsonblob.iiif.io
    Description: Custom domain that serves uploads (used only when CertificateArn is set).
  CertificateArn:
    Type: String
    Default: ""
    Description: ARN of an ACM certificate in us-east-1 covering PublicDomainName. Leave empty to use the default *.cloudfront.net domain.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Only uploads expire. Never widen this to codes/ or registry/,
          # or every access code would be deleted after 30 days.
          - Id: ExpireUploadsAfter30Days
            Status: Enabled
            Prefix: properties/
            ExpirationInDays: 30
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # The bucket stays private: CloudFront reads it through Origin Access Control,
  # and only objects under properties/ are readable.
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront can't route by method, so this viewer-request function does it:
  # OPTIONS -> answered here (CORS preflight), POST/PUT -> the upload Lambda
  # (with the viewer's host in x-public-host, so responses can include the
  # public URL), GET/HEAD -> S3, anything else -> 405.
  RouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-router"
      AutoPublish: true
      FunctionConfig:
        Comment: Route POST and PUT to the upload Lambda and answer CORS preflights
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        import cf from 'cloudfront';

        var CORS = {
          'access-control-allow-origin': { value: '*' },
          'access-control-allow-methods': { value: 'GET, HEAD, POST, PUT, OPTIONS' },
          'access-control-allow-headers': { value: 'content-type, x-access-code' },
          'access-control-max-age': { value: '86400' }
        };

        function handler(event) {
          var request = event.request;
          var method = request.method;
          if (method === 'OPTIONS') {
            return { statusCode: 204, statusDescription: 'No Content', headers: CORS };
          }
          if (method === 'POST' || method === 'PUT') {
            // Always overwrite, so a viewer can't choose the host in returned URLs.
            delete request.headers['x-public-host'];
            if (request.headers.host) {
              request.headers['x-public-host'] = { value: request.headers.host.value };
            }
            cf.selectRequestOriginById('UploadFunctionOrigin');
            return request;
          }
          if (method === 'GET' || method === 'HEAD') {
            return request;
          }
          return {
            statusCode: 405,
            statusDescription: 'Method Not Allowed',
            headers: {
              'allow': { value: 'GET, HEAD, POST, PUT, OPTIONS' },
              'access-control-allow-origin': { value: '*' }
            }
          };
        }

  # Forward only what the upload Lambda needs. The viewer's Host header is not
  # forwarded, so the Lambda function URL accepts the request.
  ForwardUploadHeadersPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-forward-upload-headers"
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [content-type, x-access-code, x-public-host]
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: none

  CorsHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-cors"
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items: [content-type, x-access-code]
          AccessControlAllowMethods:
            Items: [GET, HEAD, POST, PUT, OPTIONS]
          AccessControlAllowOrigins:
            Items: ["*"]
          AccessControlMaxAgeSec: 86400
          OriginOverride: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} public JSON"
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If [HasCustomDomain, [!Ref PublicDomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: DataBucketOrigin
            DomainName: !GetAtt DataBucket.RegionalDomainName
            # /acme/x.json is served from s3://<bucket>/properties/acme/x.json,
            # so nothing outside properties/ is reachable through CloudFront.
            OriginPath: /properties
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          # PUT /<property>/<file>.json is sent here by RouterFunction.
          - Id: UploadFunctionOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt UploadFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: DataBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          # CloudFront needs the full method set to allow POST/PUT; RouterFunction
          # rejects PATCH/DELETE with 405.
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Honours the objects' Cache-Control: max-age=60, so PUT updates show within a minute.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          OriginRequestPolicyId: !Ref ForwardUploadHeadersPolicy
          ResponseHeadersPolicyId: !Ref CorsHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouterFunction.FunctionARN

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadUploads
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${DataBucket.Arn}/properties/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.12
      Architectures: [arm64]
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          # Can't reference the distribution here (it depends on this function's URL),
          # so without a custom domain the handler builds "url" from the x-public-host
          # header the router function adds (requests through CloudFront only).
          PUBLIC_BASE_URL: !If [HasCustomDomain, !Sub "https://${PublicDomainName}", ""]
      FunctionUrlConfig:
        AuthType: NONE
        # The function URL service answers preflights and adds CORS headers itself,
        # so the handler must not add its own.
        Cors:
          AllowOrigins: !Ref AllowedUploadOrigins
          AllowMethods: [POST]
          AllowHeaders: [content-type, x-access-code]
          MaxAge: 86400
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${DataBucket.Arn}/codes/*"
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${DataBucket.Arn}/properties/*"
            # Lets HEAD on a missing key return 404 instead of 403 (PUT is update-only).
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn

Outputs:
  FunctionUrl:
    Description: POST new JSON here with the x-access-code header.
    Value: !GetAtt UploadFunctionUrl.FunctionUrl
  BucketName:
    Value: !Ref DataBucket
  PublicBaseUrl:
    Description: Uploads are readable at <PublicBaseUrl>/<key>.
    Value: !If
      - HasCustomDomain
      - !Sub "https://${PublicDomainName}"
      - !Sub "https://${Distribution.DomainName}"
  CloudFrontDomain:
    Description: Point a CNAME for PublicDomainName at this.
    Value: !GetAtt Distribution.DomainName
