version = 0.1

[default.global.parameters]
stack_name = "json-blob"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = false
# To serve uploads from jsonblob.iiif.io, add the ACM certificate ARN (must be in us-east-1):
# parameter_overrides = "BucketName=iiif-json-blob CertificateArn=arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/ID"
parameter_overrides = "BucketName=iiif-json-blob CertificateArn=arn:aws:acm:us-east-1:420715881449:certificate/defa576d-509b-4707-afab-6d2c25a0964d"
