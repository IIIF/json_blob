[project]
name = "json-blob"
version = "0.1.1"
description = "Lambda that stores JSON blobs in S3, keyed by per-property access codes"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "aws-sam-cli",
    "boto3",
    "moto[s3]",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
